name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04   # ubuntu-latest (26.04) không còn bản dựng Python 3.9
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Kiểm cấu trúc skill, link, eval, khoá lộ
        run: python scripts/validate_skills.py
      - name: Test wealbee.py (không gọi mạng)
        run: python -m unittest discover -s tests -v
      - name: Biên dịch script
        run: python -m py_compile skills/wealbee-data/scripts/wealbee.py scripts/validate_skills.py
